; Runtime PHP configuration for Laravel Octane (FrankenPHP).
;
; ONLY FrankenPHP reads this file (it looks in the directory it runs from).
; Every other way of serving the app ignores it completely: Apache/mod_php,
; nginx + PHP-FPM, LiteSpeed, `php artisan serve`, and the php CLI all use
; their own system php.ini. If you are not serving with FrankenPHP you can
; leave this file alone — apply the same two settings (a memory_limit with
; headroom, log_errors on) in your server's own PHP configuration instead.
;
; WHY THIS FILE EXISTS (card #491)
; FrankenPHP's static binary ships WITHOUT a php.ini. With none present,
; php_ini_loaded_file() is empty and PHP runs on its compile-time defaults:
;
;     memory_limit = 128M
;     log_errors   = 0
;
; Under Octane a worker boots the application once and accumulates memory
; across requests, so it rides that 128M ceiling. Whichever worker crosses it
; dies mid-request and the visitor gets HTTP 500 with an EMPTY body — while
; log_errors=0 silently discards the fatal, so nothing appears in laravel.log,
; in the process manager's stdout/stderr logs, or anywhere else. In production
; that produced recurring all-agent /widget/init 500 bursts that took a week
; to trace, precisely because the stack was blind by default.
;
; FrankenPHP loads this file from the directory it runs in (the project root,
; where the `frankenphp` binary also lives). Verify a change WITHOUT
; restarting anything:
;
;     ./frankenphp php-cli -r 'echo php_ini_loaded_file(), PHP_EOL;'
;
; Then `pm2 restart pitchbar-octane`. `php artisan octane:reload` is NOT
; enough — php.ini is read once, when the process starts.
;
; The PHP CLI does not search the working directory for php.ini, so this file
; does not affect `php artisan`, Herd, or the local test suite.

; Headroom over the ~105-125MB an Octane worker settles at. Combined with
; --max-requests=500 (see ecosystem.config.cjs) a worker recycles long before
; it can approach this. If fatals appear in error_log at this limit, that is a
; leak to fix, not a number to raise.
memory_limit = 512M

; Non-negotiable. Without these a worker fatal leaves no trace at all.
; Relative to the process working directory, which PM2 pins to the project
; root via `cwd: __dirname`.
log_errors = On
error_log = storage/logs/php-fatal.log

; Never leak internals to visitors; the log above is the record.
display_errors = Off
