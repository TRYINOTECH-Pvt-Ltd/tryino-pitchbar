; Loaded by the production FrankenPHP image via conf.d (not the static-binary
; php.ini at the project root). Keep memory + error logging in lockstep with
; that file — Octane workers settle near 105-125 MB.

memory_limit = 512M
log_errors = On
error_log = /app/storage/logs/php-fatal.log
display_errors = Off
display_startup_errors = Off

upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

; SSE widget streams call set_time_limit(0); this is the CLI/FPM fallback.
max_execution_time = 0
max_input_time = 120

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = 1255
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
