name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # IMPORTANT: use the *:check variants. The non-:check scripts
      # (pint without --test, prettier --write, eslint --fix) modify
      # files in place. CI was passing because rewrites happened
      # silently — that masked real lint regressions on PRs.

      - name: Pint (check, no rewrite)
        run: composer lint:check

      - name: Prettier (check)
        run: npm run format:check

      - name: ESLint (check)
        run: npm run lint:check

      - name: TypeScript no-emit type check
        run: npm run types:check
